# One-time lockfile regeneration on this trusted feature branch only.
# Delete after the pilot lockfile is committed and verified.
name: Bootstrap Cloudflare pilot lockfile

on:
  push:
    branches: [feat/cloudflare-static-assets-pilot]
    paths:
      - package.json
      - .github/workflows/bootstrap-cloudflare-pilot.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'yesvus/dashboard-template' && github.ref == 'refs/heads/feat/cloudflare-static-assets-pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true # strictly branch-scoped one-time bot commit
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Regenerate lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit regenerated lockfile to this feature branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(workers): regenerate Cloudflare pilot lockfile [skip ci]'
          git push origin HEAD:refs/heads/feat/cloudflare-static-assets-pilot
      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build with typechecks
        run: pnpm build
      - name: Check Cloudflare worker bundle without deployment
        run: pnpm run workers:check
        env:
          CF_SEND_TELEMETRY: 'false'
