name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm run workers:check
        env:
          CF_SEND_TELEMETRY: 'false'
      - run: pnpm test:browser:install
      - run: pnpm test

  shared-workers-canary:
    name: reusable Workers contract pilot
    if: github.event_name == 'pull_request'
    # Temporary ref for cross-repo contract testing. Pin to a reviewed
    # immutable commit after yesvus/.github PR #3 merges.
    uses: yesvus/.github/.github/workflows/frontend-workers-checks.yml@feat/workers-frontend-ci
    permissions:
      contents: read
    with:
      node-version: '24'
      pnpm-version: '10'
      run-format: true
      run-browser-tests: false
      check-cloudflare: true
