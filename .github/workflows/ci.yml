name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm run workers:check
        env:
          CF_SEND_TELEMETRY: 'false'
      - run: pnpm test:browser:install
      - run: pnpm test

  shared-workers-canary:
    name: reusable Workers contract pilot
    if: github.event_name == 'pull_request'
    # Immutable shared-workflow revision; update deliberately after
    # yesvus/.github PR #3 merges.
    uses: yesvus/.github/.github/workflows/frontend-workers-checks.yml@0c0a3aeee1b3a95d857b7d86c49aeb9724b93f99
    permissions:
      contents: read
    with:
      node-version: '24.22.1'
      pnpm-version: '10'
      run-format: true
      run-browser-tests: false
      check-cloudflare: true
